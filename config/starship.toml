# Orbit Desktop — Tokyo Night Starship Prompt
add_newline = true
command_timeout = 800

format = """
[](#7aa2f7)\
$os\
[](bg:#bb9af7 fg:#7aa2f7)\
$directory\
[](fg:#bb9af7 bg:#24283b)\
$git_branch\
$git_status\
[](fg:#24283b bg:#1f2335)\
$python\
$rust\
$nodejs\
$cmd_duration\
[](fg:#1f2335)
$character"""

[os]
disabled = false
style = "bg:#7aa2f7 fg:#14161f bold"

[os.symbols]
Arch = " 󰣇 "
Linux = "  "

[directory]
style = "bg:#bb9af7 fg:#14161f bold"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:#24283b fg:#7dcfff bold"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "bg:#24283b fg:#e0af68"
format = "[$all_status$ahead_behind]($style)"

[python]
symbol = ""
style = "bg:#1f2335 fg:#9ece6a"
format = "[ $symbol ($version) ]($style)"

[rust]
symbol = ""
style = "bg:#1f2335 fg:#ff9e64"
format = "[ $symbol ($version) ]($style)"

[nodejs]
symbol = ""
style = "bg:#1f2335 fg:#9ece6a"
format = "[ $symbol ($version) ]($style)"

[cmd_duration]
min_time = 1500
style = "bg:#1f2335 fg:#e0af68"
format = "[ 󱐋 $duration ]($style)"

[character]
success_symbol = "[❯](bold #7aa2f7)"
error_symbol = "[❯](bold #f7768e)"
vimcmd_symbol = "[❮](bold #9ece6a)"
